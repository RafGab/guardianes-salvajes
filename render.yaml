services:
  - type: web
    name: guardianes-salvajes
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
